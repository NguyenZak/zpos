name: Daily Supabase Backup

# Chạy 2h sáng UTC mỗi ngày (= 9h sáng Việt Nam)
# Có thể chạy thủ công qua tab Actions → Run workflow
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# CÁCH SETUP (làm 1 lần):
#
# 1. Lấy connection string từ Supabase:
#    Dashboard → Project Settings → Database → Connection String → URI
#    (chọn "Use connection pooling" → port 6543)
#
# 2. Tạo Cloudflare R2 bucket "zpos-backup":
#    Cloudflare Dashboard → R2 → Create bucket → name: zpos-backup
#    Manage API Tokens → Create API token → R2 → Object Read & Write
#    → copy Access Key ID + Secret Access Key + Account ID
#
# 3. Thêm secret vào GitHub:
#    Repo Settings → Secrets and variables → Actions → New repository secret
#    Cần 6 secret:
#    - SUPABASE_DB_URL              (connection string từ bước 1)
#    - R2_ACCOUNT_ID                (Cloudflare account ID)
#    - R2_ACCESS_KEY_ID
#    - R2_SECRET_ACCESS_KEY
#    - R2_BUCKET                    (= "zpos-backup")
#    - TELEGRAM_BOT_TOKEN           (optional, để nhận alert — xem bước 4)
#    - TELEGRAM_CHAT_ID             (optional)
#
# 4. (Optional) Tạo Telegram bot để nhận alert:
#    - Chat với @BotFather → /newbot → lấy bot token
#    - Chat với bot vừa tạo (gửi /start)
#    - Mở https://api.telegram.org/bot<TOKEN>/getUpdates → lấy chat.id
#
# 5. Test thủ công lần đầu:
#    Actions tab → "Daily Supabase Backup" → Run workflow

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Postgres client + AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli
          psql --version
          pg_dump --version

      - name: Setup timestamp
        id: ts
        run: echo "stamp=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Dump database
        env:
          PGPASSWORD_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          pg_dump "$PGPASSWORD_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --quote-all-identifiers \
            --format=plain \
            | gzip -9 > "zpos-${{ steps.ts.outputs.stamp }}.sql.gz"
          ls -lh zpos-${{ steps.ts.outputs.stamp }}.sql.gz

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "zpos-${{ steps.ts.outputs.stamp }}.sql.gz" \
            "s3://${{ secrets.R2_BUCKET }}/daily/zpos-${{ steps.ts.outputs.stamp }}.sql.gz" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Rotate old backups (keep 30 most recent in daily/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 ls "s3://${{ secrets.R2_BUCKET }}/daily/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            | sort -k1,2 -r \
            | awk 'NR>30 {print $4}' \
            | while read -r f; do
                [ -n "$f" ] && aws s3 rm "s3://${{ secrets.R2_BUCKET }}/daily/$f" \
                  --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" || true
              done

      - name: Notify success via Telegram
        if: success() && env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SIZE=$(ls -lh zpos-${{ steps.ts.outputs.stamp }}.sql.gz | awk '{print $5}')
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="Markdown" \
            -d text="✅ *ZPOS Backup OK*%0A%0A📦 File: zpos-${{ steps.ts.outputs.stamp }}.sql.gz%0A📏 Size: ${SIZE}%0A🕐 Time: $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: Notify failure via Telegram
        if: failure() && env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="Markdown" \
            -d text="🚨 *ZPOS Backup FAILED*%0A%0A🕐 $(date -u +'%Y-%m-%d %H:%M UTC')%0A🔗 [Xem log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
